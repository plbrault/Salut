<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration Error</title>
    <script src="/static/tailwindcss.js"></script>
    {% for href in theme_font_links %}
    <link rel="stylesheet" href="{{ href }}">
    {% endfor %}
    <script>
        window.themeConfig = {{ theme_config | safe }};
        (function() {
            var theme = window.themeConfig.single
                ? 'light'
                : (localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <style>
        {{ theme_css | safe }}
        :root {
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #991b1b;
        }
        [data-theme="dark"] {
            --error-bg: #450a0a;
            --error-border: #7f1d1d;
            --error-text: #fca5a5;
        }
    </style>
</head>
<body class="p-8 flex items-center justify-center min-h-screen" style="background: var(--bg); font-family: var(--font-family);">
    <div class="max-w-lg w-full rounded-lg border p-6" style="background: var(--error-bg); border-color: var(--error-border);">
        <h1 class="text-xl font-semibold mb-2" style="color: var(--error-text);">Configuration Error</h1>
        <p class="text-sm mb-4" style="color: var(--error-text);">Your config file could not be loaded.</p>
        <pre class="text-sm p-4 rounded overflow-x-auto" style="background: var(--card-bg); color: var(--text); border: 1px solid var(--border);">{{ error }}</pre>
        <p class="text-sm mt-4" style="color: var(--text-muted);">Fix the issue in <code>config.yml</code> and reload the page.</p>
    </div>
</body>
</html>
