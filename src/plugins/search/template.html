<form action="{{ action_url }}" method="GET"{% if results_in_new_tab %} target="_blank"{% endif %} style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
    <style>
        .search-btn {
            background-color: var(--accent);
            color: var(--accent-contrast);
            border: none;
            border-radius: 0.375rem;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .search-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
    <input
        type="text"
        name="{{ query_param }}"
        placeholder="{{ placeholder_text }}"
        style="flex: 1 1 0; min-width: 0; padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.375rem; font-size: 0.875rem; background: var(--card-bg); color: var(--text);"
        required
    />
    <button
        type="submit"
        class="search-btn"
    >
        {{ button_text }}
    </button>
</form>
